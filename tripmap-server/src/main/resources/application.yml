# 公共配置：与环境无关的项放这里；环境相关项见 application-{env}.yml
# 激活方式：环境变量 TRIPMAP_PROFILE，缺省为 dev
# 密钥一律环境变量注入，严禁硬编码（见 AGENTS.md 第 5 节）

# 高德开放平台客户端配置（任务 1.1.2）
# api-key 一律环境变量注入（AMAP_API_KEY），见 application-{env}.yml；此处只放与环境无关的调优项
tripmap:
  amap:
    base-url: ${AMAP_BASE_URL:https://restapi.amap.com}
    # QPS 限流（令牌桶）：当前配额 3 次/秒，可通过环境变量下调
    qps: ${AMAP_QPS:3}
    # 超时与重试（指数退避）：连接 3s、读取 8s，最多重试 2 次（退避 500ms/1s + 抖动）
    connect-timeout-ms: ${AMAP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AMAP_READ_TIMEOUT_MS:8000}
    max-retries: ${AMAP_MAX_RETRIES:2}
    retry-base-delay-ms: ${AMAP_RETRY_BASE_DELAY_MS:500}

  # 和风天气客户端配置（任务 2.3）
  # api-host/api-key 为凭证，见 application-{env}.yml；此处只放与环境无关的调优项
  qweather:
    # MVP 单城市杭州：城市中心坐标（GCJ-02，与高德 POI 同系），写死省去 geo 解析请求；扩城市时再引入 geo/v2/city
    default-city: ${TRIPMAP_DEFAULT_CITY:杭州}
    city-coordinate-lat: ${QWEATHER_CITY_LAT:30.25}
    city-coordinate-lon: ${QWEATHER_CITY_LON:120.15}
    # 预报窗口与降级阈值（方案 A：>10 天降级；两值分离，将来启用 v7 15d 只改配置）
    forecast-max-days: ${QWEATHER_FORECAST_MAX_DAYS:10}
    degrade-threshold: ${QWEATHER_DEGRADE_THRESHOLD:10}
    # QPM 限流（令牌桶）、超时与重试（指数退避）
    qpm: ${QWEATHER_QPM:50}
    connect-timeout-ms: ${QWEATHER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${QWEATHER_READ_TIMEOUT_MS:10000}
    max-retries: ${QWEATHER_MAX_RETRIES:2}
    retry-base-delay-ms: ${QWEATHER_RETRY_BASE_DELAY_MS:500}
    # Redis 缓存 TTL（TASKS 2.3.4：30～60 分钟）
    cache-ttl-minutes: ${QWEATHER_CACHE_TTL_MINUTES:30}

  # 通勤矩阵工具配置（任务 2.4，amap-route-api.md §2/§3/§7）
  commute:
    # Redis 缓存 TTL（设计说明书 §8.3）：7 天
    cache-ttl-days: ${COMMUTE_CACHE_TTL_DAYS:7}
    # 算路策略（amap-route-api.md §2.2：32=高德推荐；§3.2：0=公交推荐模式）
    driving-strategy: ${COMMUTE_DRIVING_STRATEGY:32}
    transit-strategy: ${COMMUTE_TRANSIT_STRATEGY:0}
    # 公交返回方案条数（矩阵只取最优一条，减少数据量）
    alternative-route: ${COMMUTE_ALTERNATIVE_ROUTE:1}
    # 缺失率阈值：超过则判该簇规划不可行（300002，交回上游对话）
    missing-ratio-threshold: ${COMMUTE_MISSING_RATIO_THRESHOLD:0.2}
    # 簇内两两查询并行度（总闸仍是高德 QPS 令牌桶）
    max-concurrency: ${COMMUTE_MAX_CONCURRENCY:8}
    # 城市 → 高德 citycode（公交 city1 只认 citycode，amap-route-api.md §3.1）
    city-codes:
      杭州: "0571"

spring:
  application:
    name: tripmap
  profiles:
    active: ${TRIPMAP_PROFILE:dev}
  # 未知路径抛出 NoHandlerFoundException，由全局异常处理产出统一返回体（不影响 springdoc 自身资源映射）
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
